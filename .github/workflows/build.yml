name: Build Thermion mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Add Android d8 to PATH
        run: echo "$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)" >> $GITHUB_PATH

      - name: Build (PC + Android)
        run: |
          chmod +x ./gradlew
          ./gradlew deploy

      - name: Upload Thermion.jar (PC + Android)
        uses: actions/upload-artifact@v4
        with:
          name: Thermion
          path: build/libs/Thermion.jar

      - name: Upload ThermionDesktop.jar (PC only)
        uses: actions/upload-artifact@v4
        with:
          name: ThermionDesktop
          path: build/libs/ThermionDesktop.jar
